name: Generate Pro Stats (agoodkind-style)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          ACCESS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
